<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#05070b">

    <title>Rick Grimes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #05070b;
            color: white;
        }

        body {
            overflow: hidden;
        }

        /* =========================
           BACKGROUND VIDEO
        ========================= */

        .background-video {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: -3;

            filter:
                brightness(0.45)
                blur(2px)
                saturate(0.8);

            transform: scale(1.04);
        }

        /* Dark overlay */

        .background-overlay {
            position: fixed;
            inset: 0;

            z-index: -2;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.20),
                    rgba(0, 0, 0, 0.65)
                );

            pointer-events: none;
        }

        /* =========================
           PAGE
        ========================= */

        .page {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        /* =========================
           GLASS CARD
        ========================= */

        .profile-card {
            width: 430px;
            max-width: 95vw;

            padding: 32px 28px 24px;

            border-radius: 28px;

            background: rgba(25, 28, 32, 0.38);

            border: 1px solid rgba(255, 255, 255, 0.15);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 30px 90px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);

            text-align: center;

            animation: cardAppear 0.8s ease;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================
           PROFILE IMAGE
        ========================= */

        .avatar-container {
            width: 110px;
            height: 110px;

            margin: 0 auto 18px;

            position: relative;
        }

        .avatar {
            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 50%;

            border: 2px solid rgba(255, 255, 255, 0.75);

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.45);
        }

        /* Online dot */

        .online {
            position: absolute;

            width: 18px;
            height: 18px;

            right: 5px;
            bottom: 5px;

            background: #35d07f;

            border-radius: 50%;

            border: 4px solid #171a1f;

            box-shadow:
                0 0 10px rgba(53, 208, 127, 0.45);
        }

        /* =========================
           NAME
        ========================= */

        .name {
            margin: 0;

            font-size: 30px;

            font-weight: 700;

            letter-spacing: -0.7px;
        }

        .username {
            margin-top: 5px;

            color: rgba(255, 255, 255, 0.50);

            font-size: 13px;
        }

        .bio {
            margin-top: 13px;
            margin-bottom: 23px;

            color: rgba(255, 255, 255, 0.78);

            font-size: 13px;
        }

        /* =========================
           LINKS
        ========================= */

        .links {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        .link {
            display: flex;

            align-items: center;

            gap: 13px;

            padding: 14px 15px;

            border-radius: 15px;

            color: white;

            text-decoration: none;

            background: rgba(255, 255, 255, 0.055);

            border: 1px solid rgba(255, 255, 255, 0.11);

            transition: 0.2s ease;
        }

        .link:hover {
            transform: translateY(-2px);

            background: rgba(255, 255, 255, 0.10);

            border-color: rgba(255, 255, 255, 0.25);
        }

        .icon {
            width: 25px;

            text-align: center;

            font-size: 19px;
        }

        .link-name {
            flex: 1;

            text-align: left;

            font-size: 14px;

            font-weight: 600;
        }

        .arrow {
            color: rgba(255, 255, 255, 0.50);
        }

        /* =========================
           MUSIC PLAYER
        ========================= */

        .music-player {
            margin-top: 15px;

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 12px;

            border-radius: 17px;

            background: rgba(0, 0, 0, 0.22);

            border: 1px solid rgba(255, 255, 255, 0.10);
        }

        .play-button {
            width: 43px;
            height: 43px;

            flex-shrink: 0;

            border: none;

            border-radius: 13px;

            background: rgba(255, 255, 255, 0.13);

            color: white;

            font-size: 15px;

            cursor: pointer;

            transition: 0.2s;
        }

        .play-button:hover {
            background: rgba(255, 255, 255, 0.20);
        }

        .music-info {
            flex: 1;

            min-width: 0;

            text-align: left;
        }

        .song-name {
            font-size: 12px;

            font-weight: 700;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .artist {
            margin-top: 3px;

            font-size: 9px;

            color: rgba(255, 255, 255, 0.50);

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .progress {
            width: 100%;

            height: 4px;

            margin-top: 9px;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.12);

            overflow: hidden;
        }

        .progress-bar {
            width: 0%;

            height: 100%;

            background: white;

            transition: width 0.1s linear;
        }

        .time {
            width: 35px;

            text-align: right;

            color: rgba(255, 255, 255, 0.50);

            font-size: 10px;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 14px;

            color: rgba(255, 255, 255, 0.28);

            font-size: 9px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .page {
                padding: 15px;
            }

            .profile-card {
                padding: 27px 18px 21px;

                border-radius: 23px;
            }

            .avatar-container {
                width: 96px;
                height: 96px;
            }

            .name {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <!-- =================================
         BACKGROUND VIDEO
         Your GitHub file:
         background.mp4
    ================================== -->

    <video
        class="background-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
    >
        <source src="background.mp4" type="video/mp4">
    </video>

    <div class="background-overlay"></div>


    <!-- =================================
         PROFILE
    ================================== -->

    <main class="page">

        <section class="profile-card">

            <!-- Profile picture -->

            <div class="avatar-container">

                <img
                    src="avatar.jpg"
                    alt="Rick Grimes"
                    class="avatar"
                >

                <span class="online"></span>

            </div>


            <!-- Name -->

            <h1 class="name">
                Rick Grimes
            </h1>

            <div class="username">
                @rickgrimes
            </div>

            <div class="bio">
                Welcome to my profile.
            </div>


            <!-- =================================
                 SOCIAL LINKS
            ================================== -->

            <div class="links">

                <a
                    class="link"
                    href="https://www.instagram.com/edeee_33.33/"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <span class="icon">
                        ◎
                    </span>

                    <span class="link-name">
                        Instagram
                    </span>

                    <span class="arrow">
                        ↗
                    </span>

                </a>


                <a
                    class="link"
                    href="https://discord.gg/eF7Q35UBrY"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <span class="icon">
                        ◈
                    </span>

                    <span class="link-name">
                        Discord
                    </span>

                    <span class="arrow">
                        ↗
                    </span>

                </a>

            </div>


            <!-- =================================
                 MUSIC PLAYER
            ================================== -->

            <div class="music-player">

                <button
                    class="play-button"
                    id="playButton"
                >
                    ▶
                </button>


                <div class="music-info">

                    <div class="song-name">
                        Back to Friends
                    </div>

                    <div class="artist">
                        slowed to perfection — TommyMuzzic
                    </div>


                    <div class="progress">

                        <div
                            class="progress-bar"
                            id="progressBar"
                        ></div>

                    </div>

                </div>


                <div
                    class="time"
                    id="time"
                >
                    0:24
                </div>

            </div>


            <div class="footer">
                Rick Grimes
            </div>

        </section>

    </main>


    <!-- =================================
         MUSIC
         Your GitHub file:
         music.mp3
    ================================== -->

    <audio
        id="music"
        preload="auto"
        autoplay
    >

        <source
            src="music.mp3"
            type="audio/mpeg"
        >

    </audio>


    <script>

        const music =
            document.getElementById("music");

        const playButton =
            document.getElementById("playButton");

        const progressBar =
            document.getElementById("progressBar");

        const time =
            document.getElementById("time");


        /*
         =================================
         MUSIC START POSITION
         =================================

         24 seconds
        */

        const START_TIME = 24;


        /*
         Format time
        */

        function formatTime(seconds) {

            if (!Number.isFinite(seconds)) {

                return "0:24";

            }

            const minutes =
                Math.floor(seconds / 60);

            const secondsPart =
                Math.floor(seconds % 60)
                    .toString()
                    .padStart(2, "0");

            return minutes + ":" + secondsPart;

        }


        /*
         Set song to second 24
        */

        function setStartTime() {

            if (
                Number.isFinite(music.duration) &&
                music.duration > START_TIME
            ) {

                music.currentTime =
                    START_TIME;

                time.textContent =
                    "0:24";

            }

        }


        /*
         Browser loaded the music
        */

        music.addEventListener(
            "loadedmetadata",
            () => {

                setStartTime();

                /*
                 Try autoplay
                */

                music.currentTime =
                    START_TIME;

                music.play()
                    .then(() => {

                        playButton.textContent =
                            "Ⅱ";

                    })
                    .catch(() => {

                        /*
                         Chrome blocked autoplay.
                         User interaction will
                         start it.
                        */

                        playButton.textContent =
                            "▶";

                    });

            }
        );


        /*
         Play button
        */

        playButton.addEventListener(
            "click",
            async () => {

                try {

                    if (music.paused) {

                        /*
                         If starting from the
                         beginning, jump to 24.
                        */

                        if (
                            music.currentTime < START_TIME ||
                            music.ended
                        ) {

                            music.currentTime =
                                START_TIME;

                        }

                        await music.play();

                        playButton.textContent =
                            "Ⅱ";

                    }

                    else {

                        music.pause();

                        playButton.textContent =
                            "▶";

                    }

                }

                catch (error) {

                    console.log(
                        "Music error:",
                        error
                    );

                }

            }
        );


        /*
         Update progress
        */

        music.addEventListener(
            "timeupdate",
            () => {

                const duration =
                    music.duration || 0;

                if (duration > 0) {

                    const percent =
                        (music.currentTime /
                            duration) * 100;

                    progressBar.style.width =
                        percent + "%";

                }

                time.textContent =
                    formatTime(
                        music.currentTime
                    );

            }
        );


        /*
         When song ends
        */

        music.addEventListener(
            "ended",
            () => {

                playButton.textContent =
                    "▶";

                progressBar.style.width =
                    "0%";

                music.currentTime =
                    START_TIME;

                time.textContent =
                    "0:24";

            }
        );


        /*
         Chrome sometimes allows
         audio after ANY interaction
         with the page.

         Try to start it again.
        */

        document.addEventListener(
            "click",
            async () => {

                if (
                    music.paused &&
                    music.currentTime < START_TIME
                ) {

                    music.currentTime =
                        START_TIME;

                    try {

                        await music.play();

                        playButton.textContent =
                            "Ⅱ";

                    }

                    catch (error) {

                        console.log(
                            "Autoplay blocked"
                        );

                    }

                }

            },
            { once: true }
        );

    </script>

</body>
</html>
